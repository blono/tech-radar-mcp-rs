# ============================================================
# topic_rules — キーワードマッチ + score boost
#
# boost の目安:
#   25 ... 最重要（セキュリティ系）
#   20 ... 重要
#   15 ... 準重要
#   10 ... 関心あり
#   5  ... 軽微
# ============================================================

[[topic_rules]]
topic    = "security"
keywords = ["cve", "vulnerability", "rce", "xss", "csrf", "sqli",
            "supply chain", "zero-day", "patch", "exploit", "breach",
            "脆弱性", "セキュリティ"]
boost    = 25

[[topic_rules]]
topic    = "mcp"
keywords = ["mcp", "model context protocol", "agent", "tool calling", "tool use"]
boost    = 22

[[topic_rules]]
topic    = "rust"
keywords = ["rust", "cargo", "crates.io", "tokio", "axum", "rustc", "borrow checker"]
boost    = 20

[[topic_rules]]
topic    = "typescript"
keywords = ["typescript", "tsgo", "javascript", "tsc", "eslint", "biome"]
boost    = 18

[[topic_rules]]
topic    = "ai"
keywords = ["openai", "chatgpt", "claude", "gemini", "copilot", "llm",
            "gpt-4", "gpt-5", "gpt-6", "o3", "o4", "anthropic", "perplexity",
            "vibe coding", "生成ai", "生成 ai"]
