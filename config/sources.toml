# Tech Radar MCP source registry.
#
# source_type の使い分け:
#   official   ... 言語・フレームワーク・クラウドの公式ブログ / changelog
#   changelog  ... リリースノート専用ページ
#   security   ... CVE / 脆弱性情報専用
#   community  ... Zenn / はてぶ / HN などのコミュニティ
#   media      ... 技術系メディア（DevelopersIO / InfoQ など）

default_freshness_hours = 24
max_items_per_source    = 50
max_feed_bytes          = 10485760  # 10 MiB
request_timeout_seconds = 5
cache_ttl_seconds       = 900       # 15 分
max_summary_chars       = 1000


