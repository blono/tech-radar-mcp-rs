[package]
name = "tech-radar-mcp-rs"
version = "0.1.0"
edition = "2024"
description = "Rust MCP server for fresh engineering trends from configured RSS/Atom feeds."
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
feed-rs = "2"
futures = "0.3"
html-escape = "0.2"
notify = "8"
rmcp = { version = "1.6.0", features = ["server", "macros", "schemars", "transport-io"] }
schemars = { version = "1", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2"
wreq = { version = "6.0.0-rc.28", features = ["gzip", "brotli", "deflate"] }
wreq-util = "3.0.0-rc.10"

[dev-dependencies]
tempfile = "3"
